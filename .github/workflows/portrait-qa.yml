name: MX Astro screenshot-specific profile QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portrait-qa.yml'
      - 'src/main.ts'
      - 'src/moonPersonal.ts'
      - 'src/natalPortrait.ts'
      - 'scripts/visual-qa.spec.cjs'
      - 'tests/profileMoonSwitch.test.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-saved-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --prefix /tmp/astro-qa --no-save @playwright/test@1.58.2
      - run: /tmp/astro-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify profile, Moon and Go Mode on desktop and iPhone
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          /tmp/astro-qa/node_modules/.bin/playwright test --config scripts/playwright.config.cjs --project=chromium --grep "saved People owner switches|Today Moon prose|standalone Go Mode navigation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-switch-qa
          path: artifacts/ui-qa
          retention-days: 5
          if-no-files-found: warn
