name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Produce machine-readable static Omega inventory
        run: |
          node scripts/omega-inventory.mjs artifacts/omega-inventory.json
          node --input-type=module -e '
            import fs from "node:fs";
            const inventory=JSON.parse(fs.readFileSync("artifacts/omega-inventory.json","utf8"));
            if(!inventory.modules?.length||!inventory.routes?.length||!inventory.testFiles?.length)
              throw new Error("Source/route/test inventory is incomplete");
            console.log(JSON.stringify(inventory.counts));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mx-astro-omega-static-inventory
          path: artifacts/omega-inventory.json
          if-no-files-found: error
      - name: Verify all 56 live Swiss asteroid ephemerides (required)
        env:
          MX_ORBIT_LIVE_TEST: '1'
          MX_ORBIT_LIVE_FULL: '1'
        run: node --experimental-strip-types --test scripts/asteroid-live.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mx-orbit-web-build
          path: dist
          if-no-files-found: error
