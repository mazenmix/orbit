name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Live Swiss asteroid smoke (informational)
        continue-on-error: true
        env:
          MX_ORBIT_LIVE_TEST: '1'
          MX_ORBIT_LIVE_FULL: '1'
        run: node --experimental-strip-types --test tests/asteroidLive.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mx-orbit-web-build
          path: dist
          if-no-files-found: error
