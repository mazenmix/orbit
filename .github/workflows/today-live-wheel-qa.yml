name: Today real-time sky — focused device QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/today-live-wheel-qa.yml'
      - 'src/main.ts'
      - 'src/focus.css'
      - 'src/chart.ts'
      - 'scripts/visual-qa.spec.cjs'
      - 'scripts/today-live-qa.spec.cjs'
      - 'scripts/playwright.config.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mx-astro-today-wheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium and Safari/WebKit
        run: |
          npm install --prefix /tmp/astro-qa --no-save @playwright/test@1.58.2
          /tmp/astro-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test green Moon/VOC bars and live expanded SVG on desktop tablet and iPhone
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          /tmp/astro-qa/node_modules/.bin/playwright test --config scripts/playwright.config.cjs --grep "compact Today Moon and VOC green gauges"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-live-wheel-qa
          path: artifacts/ui-qa
          if-no-files-found: ignore
          retention-days: 5
