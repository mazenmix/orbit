name: Browser visuals and live Qwen3 QA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/api/**'
      - 'scripts/visual-qa.spec.cjs'
      - 'scripts/playwright.config.cjs'
      - 'scripts/qwen-live.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mx-astro-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated Playwright Chromium and WebKit

        run: |
          npm install --prefix /tmp/astro-qa --no-save @playwright/test@1.58.2
          /tmp/astro-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test desktop and iPhone-size UI
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/astro-preview.log 2>&1 &
          /tmp/astro-qa/node_modules/.bin/playwright test --config scripts/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mx-astro-visual-qa
          path: artifacts/ui-qa
          retention-days: 7
          if-no-files-found: warn
  live-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test real public Qwen3 provider with synthetic charts
        run: node scripts/qwen-live.mjs
